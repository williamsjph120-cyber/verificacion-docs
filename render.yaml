services:
  - type: web
    name: verificacion-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: verificacion-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        sync: false
